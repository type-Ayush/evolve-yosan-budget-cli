[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yosan"
version = "1.0.1"
description = "Terminal Budgeting and Financial Ledger CLI Engine"
authors = [{ name = "Ayush Jain" }]
requires-python = ">=3.8"
dependencies = [
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "requests>=2.28.0"
]

[project.scripts]
yosan = "yosan:main"

[tool.setuptools]
py-modules = ["yosan", "auth", "server"]
